# Read the Docs build for the docs site.
# Read the Docs has no built-in Zensical support, so the build steps are custom.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install -r requirements-docs.txt
    build:
      html:
        # Use the URL of the version that is built (for example .../en/stable/) as the site URL.
        - sed -i "s#^site_url = .*#site_url = \"${READTHEDOCS_CANONICAL_URL}\"#" zensical.toml
        - zensical build --clean
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -r site/. "$READTHEDOCS_OUTPUT/html/"
